<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>✨ AI Quote Generator</h1>

        <select id="category">
            <option value="success">Success</option>
            <option value="love">Love</option>
            <option value="coding">Coding</option>
        </select>

        <div class="quote-box">
            <p id="quote">Click generate to get a quote!</p>
            <span id="author"></span>
        </div>

        <button onclick="getQuote()">Generate Quote</button>
        <button onclick="copyQuote()">Copy</button>
        <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
